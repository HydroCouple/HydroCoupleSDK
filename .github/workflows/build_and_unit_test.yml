name: Build and Unit Test

on:
  push:
    branches: [ "master", "dev", "removing_qt" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Checkout HydroCouple interface headers
        uses: actions/checkout@v4
        with:
          repository: HydroCouple/HydroCouple
          ref: dev
          path: HydroCouple

      - name: Setup vcpkg (manifest mode, tests feature)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          "-DVCPKG_MANIFEST_FEATURES=tests;hdf5"
          -DHYDROCOUPLE_INCLUDE_DIR=${{ github.workspace }}/HydroCouple/include
          -DUSE_GDAL=OFF -DUSE_NETCDF=OFF -DUSE_HDF5=ON -DUSE_OPENMP=OFF
          -DBUILD_TOOLS=OFF -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.os }}
          path: tests/artifacts/
          if-no-files-found: ignore
