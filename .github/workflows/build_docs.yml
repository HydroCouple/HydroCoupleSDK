name: Documentation

# The Doxygen site includes the manual and the C++ API.

on:
  push:
    # The working branch can be published explicitly with workflow_dispatch.
    branches: [ "master", "dev", "removing_qt" ]
    tags: [ "v*.*.*" ]
    paths:
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - '**/*.md'
      - 'CMakeLists.txt'
      - '.github/workflows/build_docs.yml'
  pull_request:
    branches: [ "master", "dev", "removing_qt" ]
    paths:
      - 'docs/**'
      - 'include/**'
      - 'src/**'
      - '**/*.md'
      - 'CMakeLists.txt'
      - '.github/workflows/build_docs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_docs:
    name: Build C++ API and user guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget tar

      - name: Install Doxygen 1.13.2
        # Pinned to the same release as the interface repo's pipeline.
        run: |
          wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz
          tar -xzf doxygen-1.13.2.linux.bin.tar.gz
          sudo cp doxygen-1.13.2/bin/doxygen /usr/local/bin/
          doxygen --version

      - name: Configure documentation
        run: cmake -S . -B build/manual -DHYDROCOUPLE_DOCS_ONLY=ON

      - name: Build and check both manuals
        run: |
          cmake --build build/manual --target docs
          test -s build/manual/docs/doxygen/html/annotated.html
          test -s build/manual/docs/doxygen/html/guide/index.html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: reference-site
          path: build/manual/docs/doxygen/html/
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build_docs
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/removing_qt'))
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download both manuals
        uses: actions/download-artifact@v4
        with:
          name: reference-site
          path: site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
